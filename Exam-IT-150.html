let cur=0, answers=Array(150).fill(null), submitted=false, seconds=150*60, timerId=null;
const labels=['ก','ข','ค','ง'];
function startExam(){document.getElementById('startCard').style.display='none';document.getElementById('exam').style.display='block';renderNav();renderQ(); if(!timerId) timerId=setInterval(()=>{seconds--; let m=Math.floor(seconds/60), s=seconds%60; document.getElementById('timer').textContent='เวลา '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); if(seconds<=0){clearInterval(timerId); submitExam();}},1000);}
function renderNav(){document.getElementById('nav').innerHTML=DATA.map((_,i)=>`<button class="${answers[i]!==null?'done':''} ${submitted?(answers[i]===DATA[i].ans?'correct':'wrong'):''}" onclick="goQ(${i})">${i+1}</button>`).join(''); document.getElementById('progress').textContent=`ข้อที่ ${cur+1}/150 - ทำแล้ว ${answers.filter(a=>a!==null).length} ข้อ`;}
function renderQ(){let it=DATA[cur]; let h=`<span class="badge">${it.cat}</span> <b>ข้อที่ ${cur+1}</b><h3 style="line-height:1.6">${it.q}</h3>`; it.opts.forEach((o,i)=>{let cls='opt'; if(answers[cur]===i) cls+=' selected'; if(submitted&&i===it.ans) cls+=' correct'; if(submitted&&answers[cur]===i&&i!==it.ans) cls+=' wrong'; h+=`<button class="${cls}" onclick="choose(${i})">${labels[i]}. ${o}</button>`;}); if(submitted){h+=`<div class="exp"><b>เฉลย: ${labels[it.ans]}. ${it.opts[it.ans]}</b><br>คำอธิบาย: ${it.exp}</div>`;} document.getElementById('qbox').innerHTML=h; renderNav(); window.scrollTo({top:0,behavior:'smooth'});}
function choose(i){if(submitted) return; answers[cur]=i; renderQ();}
function goQ(i){cur=i; renderQ();} function nextQ(){if(cur<149){cur++; renderQ();}} function prevQ(){if(cur>0){cur--; renderQ();}}
function submitExam(){submitted=true; let score=answers.filter((a,i)=>a===DATA[i].ans).length; let pct=Math.round(score/150*100); let grade=pct>=90?'ดีเยี่ยม':pct>=80?'ดีมาก':pct>=60?'ปานกลาง':pct>=40?'พอใช้':'ต้องปรับปรุง'; document.getElementById('result').style.display='block'; document.getElementById('result').innerHTML=`<h2>ผลสอบของคุณ</h2><h1 style="font-size:48px;margin:0">${score} / 150</h1><p>คิดเป็น ${pct}% - ${grade}</p><p>ตอบถูก ${score} ข้อ - ตอบผิด ${answers.filter((a,i)=>a!==null&&a!==DATA[i].ans).length} ข้อ - ไม่ได้ทำ ${answers.filter(a=>a===null).length} ข้อ</p><button onclick="showAll()">ดูเฉลยทุกข้อด้านล่าง</button>`; renderQ(); document.getElementById('result').scrollIntoView();}
function resetExam(){if(!confirm('ทำใหม่ทั้งหมดใช่ไหม?'))return; answers=Array(150).fill(null); submitted=false; cur=0; document.getElementById('result').style.display='none'; document.getElementById('allBox').innerHTML=''; renderQ();}
function showAll(){let h='<h2>เฉลยทุกข้อ</h2>'; DATA.forEach((it,i)=>{h+=`<div class="card"><span class="badge">${it.cat}</span> <b>ข้อ ${i+1}</b><p>${it.q}</p>`; it.opts.forEach((o,j)=>{h+=`<div class="opt ${j===it.ans?'correct':''}">${labels[j]}. ${o}</div>`}); h+=`<div class="exp"><b>เฉลย: ${labels[it.ans]}</b> - ${it.exp}</div></div>`;}); document.getElementById('allBox').innerHTML=h; document.getElementById('allBox').scrollIntoView();}
</script></body></html>
