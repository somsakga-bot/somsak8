<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>ข้อสอบภาษาไทย ระดับยาก</title>

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#222;--mu:#666;--ac:#8a1c2b;--ok:#1d7a3e;--no:#c0392b;--bd:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#222428;--tx:#eee;--mu:#aaa;--ac:#e06a7a;--ok:#4cc27a;--no:#ff7b6b;--bd:#3a3d44}}
:root[data-theme="dark"]{--bg:#17181b;--card:#222428;--tx:#eee;--mu:#aaa;--ac:#e06a7a;--ok:#4cc27a;--no:#ff7b6b;--bd:#3a3d44}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 Sarabun,Tahoma,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:8px 0;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.tag{display:inline-block;font-size:.8rem;background:var(--ac);color:#fff;border-radius:99px;padding:0 10px}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,transparent)}
.ex{border-left:4px solid var(--ac);padding:4px 12px;margin-top:10px;color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button.b{font:inherit;border:0;border-radius:9px;padding:8px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.b.g{background:var(--bd);color:var(--tx)}
table{width:100%;border-collapse:collapse}td,th{padding:4px 8px;border-bottom:1px solid var(--bd);text-align:left}
@media print{.row,.bar,.opt{break-inside:avoid}.nop{display:none}.opt{border:1px solid #999;background:#fff}}
</style></head><body><main>
<h1>ข้อสอบภาษาไทย ระดับยาก (4 ตัวเลือก)</h1>

</main>

[0,"“ข่าวลวงแพร่ได้เร็วเพราะคนมักเชื่อสิ่งที่ตรงกับความเชื่อเดิมของตน มากกว่าจะตรวจสอบความจริง” ข้อความนี้ระบุสาเหตุของการแพร่ข่าวลวงตามข้อใด",["สื่อขาดจรรยาบรรณ","เทคโนโลยีก้าวหน้าเกินไป","คนเชื่อสิ่งที่ตรงกับความเชื่อเดิมโดยไม่ตรวจสอบ","ไม่มีกฎหมายควบคุม"],2,"ข้อความระบุสาเหตุไว้ตรง ๆ ว่าคนเชื่อสิ่งที่ตรงกับความเชื่อเดิมมากกว่าตรวจสอบ ข้ออื่นเป็นสาเหตุที่ข้อความไม่ได้กล่าวถึง"],
[0,"“แม้ฝนตกหนักตลอดคืน แต่ชาวบ้านบริเวณนั้นไม่อพยพ เพราะเคยผ่านน้ำท่วมหลายครั้งโดยไม่เสียหายมาก” สรุปได้สมเหตุสมผลที่สุดตามข้อใด",["ชาวบ้านประมาทเสมอ","ประสบการณ์เดิมทำให้ชาวบ้านประเมินว่าไม่อันตราย","ฝนไม่ได้ตกหนักจริง","ไม่มีหน่วยงานช่วยเหลือ"],1,"เหตุผลที่ข้อความให้คือ ‘เคยผ่านน้ำท่วมโดยไม่เสียหายมาก’ จึงอนุมานได้ว่าประสบการณ์ทำให้ประเมินความเสี่ยงต่ำ ข้อ 1 ตัดสินเกินหลักฐาน ข้อ 3 ขัดกับข้อความ"],
