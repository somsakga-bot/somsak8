function renderFilters(){filters.innerHTML='<button class="'+(cur==='ทั้งหมด'?'active':'')+'" onclick="setF(\'ทั้งหมด\')">ทั้งหมด (150)</button>'+topics.map(t=>'<button class="'+(cur===t?'active':'')+'" onclick="setF(\''+t.replace(/'/g,"\\'")+'\')">'+t+'</button>').join('');}
function setF(t){cur=t;renderFilters();render();}
function render(){const list=document.getElementById('list');list.innerHTML='';DATA.forEach((d,i)=>{if(cur!=='ทั้งหมด'&&d.topic!==cur)return;const div=document.createElement('div');div.className='card';div.innerHTML='<div><span class="badge">ข้อ '+(i+1)+'</span> <span class="topic">'+d.topic+'</span></div><div class="q">'+d.q+'</div>'+d.choices.map((c,j)=>'<button class="opt '+(answers[i]===j?'selected':'')+'" onclick="pick('+i+','+j+',this)">'+['ก.','ข.','ค.','ง.'][j]+' '+c+'</button>').join('')+'<div class="exp" id="exp'+i+'"><b>✅ เฉลย: '+['ก.','ข.','ค.','ง.'][d.ans]+' '+d.choices[d.ans]+'</b><br>'+d.exp+'</div>';list.appendChild(div);});update();}
function pick(i,j,el){answers[i]=j;document.querySelectorAll('#list .card').forEach(()=>{});render();document.getElementById('exp'+i)?.classList.remove('show');}
function update(){const n=Object.keys(answers).length;document.getElementById('doneCount').textContent='ตอบแล้ว '+n+' / 150';document.getElementById('bar').style.width=(n/150*100)+'%';}
function checkAll(){let score=0;DATA.forEach((d,i)=>{if(answers[i]===d.ans)score++;const e=document.getElementById('exp'+i);if(e)e.classList.add('show');});const total=DATA.length;let msg=score>=120?'🏆 ยอดเยี่ยมมาก!':score>=90?'👍 เก่งมาก':'💪 สู้ต่อไป ฝึกอีกนิด';document.getElementById('result').innerHTML='<h2>'+msg+'</h2><p style="font-size:32px;margin:6px 0">'+score+' / '+total+' คะแนน ('+Math.round(score/total*100)+'%)</p><p>ตอบถูก '+score+' ข้อ • ผิด '+(Object.keys(answers).length-score)+' ข้อ • ยังไม่ตอบ '+(total-Object.keys(answers).length)+' ข้อ</p>';document.getElementById('result').scrollIntoView({behavior:'smooth'});render();DATA.forEach((d,i)=>{const e=document.getElementById('exp'+i);if(e)e.classList.add('show');});}
function showAllExp(){document.querySelectorAll('.exp').forEach(e=>e.classList.add('show'));}
function resetAll(){answers={};document.getElementById('result').innerHTML='';render();}
renderFilters();render();
</script></body></html>
